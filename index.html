<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECHORUIN</title>

<style>
:root {
  --green: #6b8f71;
  --green-light: #8fb49a;
  --green-dark: #4f6b56;
  --green-glow: rgba(107,143,113,0.35);
  --dark: #0b0d10;
  --light: #e5e7eb;
}

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: system-ui, sans-serif;
  background: var(--dark);
  color: var(--light);
  background-image: url("https://images.pexels.com/photos/929382/pexels-photo-929382.jpeg");
  background-size: cover;
  background-position: center;
  background-blend-mode: multiply;
  overflow-x:hidden;
}

/* LOADER */
#loader {
  position: fixed;
  inset: 0;
  background: #0b0d10;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  transition: opacity 0.6s ease;
}

#loader h1 {
  font-size: 48px;
  color: var(--green-light);
  letter-spacing: 3px;
  margin-bottom: 30px;
  text-shadow: 0 0 25px var(--green-glow);
}

.loader-bar {
  width: 260px;
  height: 10px;
  background: rgba(255,255,255,0.08);
  border-radius: 10px;
  overflow: hidden;
  backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,0.1);
}

.loader-progress {
  height: 100%;
  width: 0%;
  background: linear-gradient(135deg, var(--green), var(--green-dark));
  box-shadow: 0 0 12px var(--green-glow);
  animation: loadingBar 2s ease forwards;
}

@keyframes loadingBar {
  from { width: 0%; }
  to { width: 100%; }
}

#loader.hidden {
  opacity: 0;
  pointer-events: none;
}

/* NAVIGATION */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 24px 48px;
  backdrop-filter: blur(18px);
  background: rgba(0, 0, 0, 0.35);
  border-bottom: 1px solid rgba(255,255,255,0.05);
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}

header h1 {
  font-size: 24px;
  color: var(--green-light);
  text-shadow: 0 0 12px var(--green-glow);
}

nav a {
  margin-left: 1.5rem;
  color: var(--light);
  text-decoration: none;
  font-weight: 600;
  transition: 0.2s;
}

nav a:hover {
  color: var(--green-light);
}

/* HERO */
.hero {
  text-align: center;
  padding: 120px 20px 60px;
  backdrop-filter: blur(22px);
  background: rgba(0, 0, 0, 0.45);
  margin: 60px auto;
  border-radius: 20px;
  max-width: 780px;
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow:
    inset 0 0 25px rgba(255,255,255,0.05),
    0 0 40px var(--green-glow),
    0 0 80px rgba(0,0,0,0.6);
}

.hero h2 {
  font-size: 70px;
  margin-bottom: 20px;
  background: linear-gradient(135deg, var(--green-light), var(--green-dark));
  -webkit-background-clip: text;
  color: transparent;
  text-shadow: 0 0 25px var(--green-glow);
}

.hero p {
  font-size: 20px;
  max-width: 600px;
  margin: 0 auto 40px;
  opacity: 0.9;
}

.hero .btn {
  padding: 16px 34px;
  background: linear-gradient(135deg, var(--green), var(--green-dark));
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 18px;
  cursor: pointer;
  box-shadow:
    0 0 12px var(--green-glow),
    inset 0 0 10px rgba(255,255,255,0.1);
  transition: 0.3s;
}

.hero .btn:hover {
  transform: scale(1.07);
  box-shadow:
    0 0 25px var(--green-glow),
    inset 0 0 14px rgba(255,255,255,0.15);
}

/* STATS */
.stats {
  display: flex;
  justify-content: center;
  gap: 40px;
  padding: 60px 20px;
  flex-wrap: wrap;
}

.stat {
  background: rgba(255, 255, 255, 0.06);
  backdrop-filter: blur(14px);
  padding: 24px 34px;
  border-radius: 14px;
  text-align: center;
  min-width: 160px;
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow:
    inset 0 0 20px rgba(255,255,255,0.05),
    0 0 20px rgba(0,0,0,0.4),
    0 0 25px var(--green-glow);
}

.stat h3 {
  font-size: 32px;
  margin-bottom: 8px;
  background: linear-gradient(135deg, var(--green-light), var(--green-dark));
  -webkit-background-clip: text;
  color: transparent;
  text-shadow: 0 0 20px var(--green-glow);
}

.stat p {
  font-size: 15px;
  opacity: 0.75;
}

/* MOBILE */
@media (max-width: 700px) {
  header {
    padding: 16px 20px;
  }
  nav a {
    margin-left: 0.8rem;
  }
  .hero h2 {
    font-size: 48px;
  }
  .stats {
    flex-direction: column;
    align-items: center;
  }
}
</style>
</head>

<body>

<!-- LOADER -->
<div id="loader">
  <h1>ECHORUIN</h1>
  <div class="loader-bar">
    <div class="loader-progress"></div>
  </div>
</div>

<header>
  <h1>ECHORUIN</h1>
  <nav>
    <a href="index.html">Start</a>
    <a href="karte.html">Karte</a>
  </nav>
</header>

<section class="hero">
  <h2>ECHORUIN</h2>
  <p>Ein Archiv für überwucherte Orte, vergessene Räume und die Echos vergangener Geschichten.</p>
  <button class="btn" onclick="location.href='karte.html'">Karte öffnen</button>
</section>

<section class="stats">
  <div class="stat">
    <h3>120+</h3>
    <p>Verlassene Orte</p>
  </div>
  <div class="stat">
    <h3>3000+</h3>
    <p>Archivierte Fotos</p>
  </div>
  <div class="stat">
    <h3>80+</h3>
    <p>Erkundungen</p>
  </div>
  <div class="stat">
    <h3>12+</h3>
    <p>Regionen</p>
  </div>
</section>

<script>
const loader = document.getElementById("loader");
const minTime = new Promise(resolve => setTimeout(resolve, 2000));
const pageLoaded = new Promise(resolve => window.onload = resolve);

Promise.all([minTime, pageLoaded]).then(() => {
  loader.classList.add("hidden");
});
</script>

</body>
</html>
