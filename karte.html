<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECHORUIN – Karte</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <!-- MarkerCluster -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css">

  <style>
    :root {
      --green: #6b8f71;
      --green-light: #8fb49a;
      --green-dark: #4f6b56;
      --green-glow: rgba(107, 143, 113, 0.35);
      --dark: #0b0d10;
      --light: #e5e7eb;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, sans-serif;
      background: var(--dark);
      color: var(--light);
      overflow: hidden;
    }

    /* Karte */
    #map {
      width: 100vw;
      height: 100vh;
    }

    /* Warnfenster */
    #warn-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    #warn-box {
      background: var(--green-dark);
      border: 2px solid var(--green);
      padding: 25px 30px;
      width: 90%;
      max-width: 420px;
      text-align: center;
      border-radius: 8px;
      box-shadow: 0 0 20px var(--green-glow);
      animation: fadeIn 0.4s ease-out;
    }

    #warn-box h2 {
      margin-bottom: 10px;
      color: var(--light);
      font-size: 1.4rem;
    }

    #warn-box p {
      margin-bottom: 20px;
      color: var(--light);
      opacity: 0.9;
      line-height: 1.4;
    }

    #warn-btn {
      background: var(--green);
      border: none;
      padding: 10px 20px;
      color: var(--dark);
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
      transition: 0.2s;
    }

    #warn-btn:hover {
      background: var(--green-light);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>

<body>

  <!-- Warnfenster -->
  <div id="warn-overlay">
    <div id="warn-box">
      <h2>⚠️ Warnhinweis</h2>
      <p>
        Die hier dargestellten Orte sind Lost Places.  
        Das Betreten kann gefährlich und verboten sein.  
        Handle stets verantwortungsvoll.
      </p>
      <button id="warn-btn">Ich stimme zu</button>
    </div>
  </div>

  <!-- Karte -->
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

  <script>
    // Warnfenster schließen
    document.getElementById("warn-btn").addEventListener("click", () => {
      document.getElementById("warn-overlay").style.display = "none";
    });

    // Karte initialisieren
    const map = L.map("map").setView([51.0, 10.0], 6);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "© OpenStreetMap"
    }).addTo(map);

    // MarkerCluster Beispiel
    const markers = L.markerClusterGroup();

    const exampleMarker = L.marker([51.05, 13.74]).bindPopup("Beispiel Lost Place");
    markers.addLayer(exampleMarker);

    map.addLayer(markers);
  </script>

</body>
</html>
