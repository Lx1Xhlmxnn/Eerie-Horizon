<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECHORUIN – Karte</title>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<!-- MarkerCluster CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />

<style>
:root {
  --green: #6b8f71;
  --green-light: #8fb49a;
  --green-dark: #4f6b56;
  --green-glow: rgba(107,143,113,0.35);
  --dark: #0b0d10;
  --light: #e5e7eb;
}

* { margin:0; padding:0; box-sizing:border-box; }
body { 
  font-family: system-ui, sans-serif; 
  background:#0b0d10; 
  color:#fff; 
  overflow:hidden;
}

/* LOADER */
#loader {
  position: fixed;
  inset: 0;
  background: #0b0d10;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  transition: opacity 0.6s ease;
}

#loader h1 {
  font-size: 48px;
  color: var(--green-light);
  letter-spacing: 3px;
  margin-bottom: 30px;
  text-shadow: 0 0 25px var(--green-glow);
}

.loader-bar {
  width: 260px;
  height: 10px;
  background: rgba(255,255,255,0.08);
  border-radius: 10px;
  overflow: hidden;
  backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,0.1);
}

.loader-progress {
  height: 100%;
  width: 0%;
  background: linear-gradient(135deg, var(--green), var(--green-dark));
  box-shadow: 0 0 12px var(--green-glow);
  animation: loadingBar 2s ease forwards;
}

@keyframes loadingBar {
  from { width: 0%; }
  to { width: 100%; }
}

#loader.hidden {
  opacity: 0;
  pointer-events: none;
}

/* NAVBAR */
#navbar {
  position: fixed; 
  top:0; left:0; width:100%;
  display:flex; 
  justify-content: space-between; 
  align-items:center;
  padding:1rem 2rem; 
  background: rgba(0,0,0,0.35);
  backdrop-filter: blur(18px);
  border-bottom: 1px solid rgba(255,255,255,0.05);
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  z-index:2000;
}

#navbar h2 {
  font-size:1.6rem; 
  cursor:pointer; 
  color: var(--green-light);
  text-shadow:0 0 12px var(--green-glow);
}

#navbar nav a {
  margin-left:1.5rem; 
  color:var(--light); 
  text-decoration:none; 
  font-weight:600; 
  transition:0.2s;
}

#navbar nav a:hover {
  color:var(--green-light);
}

/* MAP */
#map { 
  width:100%; 
  height:100vh; 
}

/* FILTER BOX */
#filter {
  position:absolute; 
  top:90px; 
  right:20px; 
  background: rgba(0,0,0,0.45);
  backdrop-filter: blur(14px);
  padding:1rem; 
  border-radius:12px; 
  color:var(--green-light); 
  z-index:1500;
  border:1px solid rgba(255,255,255,0.08);
  box-shadow:0 0 20px var(--green-glow);
}

#filter select {
  background:#111; 
  color:var(--green-light); 
  border:1px solid var(--green-dark); 
  padding:0.4rem; 
  border-radius:6px;
}

/* POPUP */
.leaflet-popup-content {
  background:#111; 
  color:var(--green-light); 
  font-size:0.95rem; 
  border-radius:8px; 
  padding:0.5rem;
}

.leaflet-popup-content img {
  width:100%; 
  border-radius:5px; 
  margin-top:0.5rem;
}

/* MARKER GLOW */
.glow-marker {
  animation:pulse 2s infinite;
}

@keyframes pulse {
  0%{transform:scale(1); filter:drop-shadow(0 0 5px var(--green));}
  50%{transform:scale(1.2); filter:drop-shadow(0 0 15px var(--green-light));}
  100%{transform:scale(1); filter:drop-shadow(0 0 5px var(--green));}
}

/* FOOTER */
footer {
  position:fixed;
  bottom:0; left:0;
  width:100%;
  text-align:center; 
  padding:1rem; 
  background:rgba(0,0,0,0.35);
  backdrop-filter: blur(14px);
  color:#aaa; 
  font-size:0.9rem;
  border-top:1px solid rgba(255,255,255,0.05);
}

/* MOBILE */
@media (max-width: 700px) {
  #navbar {
    padding: 0.8rem 1rem;
  }
  #navbar h2 {
    font-size: 1.3rem;
  }
  #filter {
    right: 10px;
    top: 80px;
    padding: 0.7rem;
  }
  #filter select {
    width: 100%;
  }
}
</style>
</head>
<body>

<!-- LOADER -->
<div id="loader">
  <h1>ECHORUIN</h1>
  <div class="loader-bar">
    <div class="loader-progress"></div>
  </div>
</div>

<!-- NAVBAR -->
<div id="navbar">
  <h2 onclick="location.href='index.html'">ECHORUIN</h2>
  <nav>
    <a href="index.html">Start</a>
    <a href="karte.html">Karte</a>
  </nav>
</div>

<!-- FILTER -->
<div id="filter">
  Filter nach Kategorie:
  <select id="ortFilter">
    <option value="all">Alle</option>
  </select>
</div>

<!-- MAP -->
<div id="map"></div>

<!-- FOOTER -->
<footer>
  &copy; 2026 ECHORUIN • Alle Rechte vorbehalten
</footer>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- MarkerCluster JS -->
<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

<script>
// Karte initialisieren
const map = L.map('map').setView([51.05, 13.74], 12);

// DARK MAP
L.tileLayer('https://tiles.stadiamaps.com/tiles/alidade_smooth_dark/{z}/{x}/{y}.png', {
  maxZoom: 20,
  attribution: '&copy; OpenStreetMap contributors, © Stadia Maps'
}).addTo(map);

// Cluster
const markerCluster = L.markerClusterGroup({
  showCoverageOnHover: false,
  maxClusterRadius: 50,
  spiderfyOnMaxZoom: true,
  disableClusteringAtZoom: 17
});

let alleMarker = [];

// JSON laden
fetch("orte.json")
  .then(res => res.json())
  .then(data => {
    const kategorien = new Set();

    data.forEach(ort => {
      kategorien.add(ort.kategorie);

      const marker = L.marker([ort.lat, ort.lng], {
        title: ort.name
      });

      marker.bindPopup(`
        <b>${ort.name}</b><br>
        <i>${ort.kategorie}</i><br>
        ${ort.beschreibung}<br>
        ${ort.bild ? `<img src="${ort.bild}" alt="${ort.name}">` : ""}
      `);

      marker.kategorie = ort.kategorie;
      alleMarker.push(marker);
      markerCluster.addLayer(marker);
    });

    // Kategorien ins Dropdown
    const filter = document.getElementById("ortFilter");
    kategorien.forEach(k => {
      const opt = document.createElement("option");
      opt.value = k;
      opt.textContent = k;
      filter.appendChild(opt);
    });

    map.addLayer(markerCluster);
  });

// Filter
document.getElementById("ortFilter").addEventListener("change", e => {
  const k = e.target.value;

  markerCluster.clearLayers();

  alleMarker.forEach(m => {
    if (k === "all" || m.kategorie === k) {
      markerCluster.addLayer(m);
    }
  });
});

// LOADER LOGIK
const loader = document.getElementById("loader");
const minTime = new Promise(resolve => setTimeout(resolve, 2000));
const pageLoaded = new Promise(resolve => window.onload = resolve);

Promise.all([minTime, pageLoaded]).then(() => {
  loader.classList.add("hidden");
});
</script>

</body>
</html>
