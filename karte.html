<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eerie Horizon – Karte</title>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<!-- MarkerCluster CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Roboto', sans-serif; background:#0d0d0d; color:#fff; overflow-x:hidden; }

/* Navbar */
#navbar {
  position: fixed; top:0; left:0; width:100%;
  display:flex; justify-content: space-between; align-items:center;
  padding:1rem 2rem; background: rgba(10,10,10,0.85);
  color:#00ffe5; z-index:2000; backdrop-filter: blur(5px);
}
#navbar h2 { font-size:1.5rem; cursor:pointer; text-shadow:0 0 10px #00ffe5; }
#navbar nav a { margin-left:1.5rem; color:#00ffe5; text-decoration:none; font-weight:bold; transition: color 0.3s; }
#navbar nav a:hover { color:#8a2be2; }

/* Map */
#map { width:100%; height:90vh; margin-top:60px; }

/* Filter Menü */
#filter { position:absolute; top:80px; right:20px; background: rgba(10,10,10,0.85); padding:1rem; border-radius:10px; color:#00ffe5; z-index:1000; }
#filter select { background:#111; color:#00ffe5; border:1px solid #8a2be2; padding:0.3rem; border-radius:5px; }

/* Popup */
.leaflet-popup-content { background:#111; color:#00ffe5; font-size:0.95rem; border-radius:8px; padding:0.5rem; }
.leaflet-popup-content img { width:100%; border-radius:5px; margin-top:0.5rem; }

/* Glow Marker */
.glow-marker { animation:pulse 2s infinite; }
@keyframes pulse {
  0%{transform:scale(1); filter:drop-shadow(0 0 5px #00ffe5);}
  50%{transform:scale(1.2); filter:drop-shadow(0 0 15px #8a2be2);}
  100%{transform:scale(1); filter:drop-shadow(0 0 5px #00ffe5);}
}

/* Footer */
footer { text-align:center; padding:1rem; background:#1a1a1a; color:#888; font-size:0.9rem; }
</style>
</head>
<body>

<!-- Navbar -->
<div id="navbar">
  <h2 onclick="location.href='index.html'">Eerie Horizon</h2>
  <nav>
    <a href="index.html">Start</a>
    <a href="karte.html">Karte</a>
  </nav>
</div>

<!-- Filter -->
<div id="filter">
  Filter nach Kategorie:
  <select id="ortFilter">
    <option value="all">Alle</option>
  </select>
</div>

<!-- Map -->
<div id="map"></div>

<!-- Footer -->
<footer>
  &copy; 2026 Eerie Horizon • Alle Rechte vorbehalten
</footer>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- MarkerCluster JS -->
<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

<script>
// Karte initialisieren
const map = L.map('map').setView([51.05, 13.74], 12);

// OpenStreetMap Tiles
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

// Cluster-Gruppe
const markerCluster = L.markerClusterGroup({
  showCoverageOnHover: false,
  maxClusterRadius: 50,
  spiderfyOnMaxZoom: true,
  disableClusteringAtZoom: 17
});

// Marker-Liste
let alleMarker = [];

// JSON laden
fetch("orte.json")
  .then(res => res.json())
  .then(data => {
    const kategorien = new Set();

    data.forEach(ort => {
      kategorien.add(ort.kategorie);

      const marker = L.marker([ort.lat, ort.lng], {
        title: ort.name
      });

      marker.bindPopup(`
        <b>${ort.name}</b><br>
        <i>${ort.kategorie}</i><br>
        ${ort.beschreibung}<br>
        ${ort.bild ? `<img src="${ort.bild}" alt="${ort.name}">` : ""}
      `);

      marker.kategorie = ort.kategorie;
      alleMarker.push(marker);
      markerCluster.addLayer(marker);
    });

    // Kategorien ins Dropdown einfügen
    const filter = document.getElementById("ortFilter");
    kategorien.forEach(k => {
      const opt = document.createElement("option");
      opt.value = k;
      opt.textContent = k;
      filter.appendChild(opt);
    });

    map.addLayer(markerCluster);
  });

// Filterfunktion
document.getElementById("ortFilter").addEventListener("change", e => {
  const k = e.target.value;

  markerCluster.clearLayers();

  alleMarker.forEach(m => {
    if (k === "all" || m.kategorie === k) {
      markerCluster.addLayer(m);
    }
  });
});
</script>

</body>
</html>
