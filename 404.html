<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>404 – Seite nicht gefunden</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --green:#6b8f71;
  --green-light:#8fb49a;
  --green-dark:#4f6b56;
  --green-glow:rgba(107,143,113,0.35);
  --dark:#0b0d10;
  --light:#e5e7eb;
  --warning:#ffdd7a;
}

body {
  margin:0;
  padding:0;
  background:var(--dark);
  color:var(--light);
  font-family:system-ui,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  text-align:center;
  padding:20px;
  background-image:url("https://images.pexels.com/photos/929382/pexels-photo-929382.jpeg");
  background-size:cover;
  background-position:center;
  background-blend-mode:multiply;
}

/* CONTAINER */
.wrapper {
  max-width:900px;
  width:100%;
  background:rgba(0,0,0,0.45);
  backdrop-filter:blur(18px);
  padding:40px;
  border-radius:20px;
  border:1px solid rgba(255,255,255,0.08);
  box-shadow:0 0 40px rgba(0,0,0,0.6);
}

/* ANIMATION AREA */
.animation {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:40px;
  margin-bottom:30px;
  flex-wrap:wrap;
}

/* COMIC FIGURE */
.figure {
  width:120px;
  height:180px;
  position:relative;
}

/* Kopf */
.figure .head {
  width:70px;
  height:70px;
  background:#222;
  border-radius:50%;
  border:2px solid var(--green-light);
  margin:auto;
  position:relative;
  box-shadow:0 0 15px var(--green-glow);
}

/* Augen */
.eye {
  width:10px;
  height:10px;
  background:var(--green-light);
  border-radius:50%;
  position:absolute;
  top:26px;
  animation:blink 4s infinite;
}
.eye.left { left:18px; }
.eye.right { right:18px; }

@keyframes blink {
  0%, 90%, 100% { transform:scaleY(1); }
  92% { transform:scaleY(0.1); }
}

/* Körper */
.figure .body {
  width:60px;
  height:90px;
  background:#111;
  border:2px solid var(--green-dark);
  border-radius:10px;
  margin:10px auto 0;
}

/* COMPUTER */
.computer {
  width:180px;
  height:140px;
  background:#111;
  border-radius:10px;
  border:2px solid var(--green-dark);
  position:relative;
  box-shadow:0 0 20px var(--green-glow);
}

/* Bildschirm */
.screen {
  width:140px;
  height:80px;
  background:#000;
  border:2px solid var(--green-light);
  margin:15px auto 0;
  border-radius:6px;
  position:relative;
  overflow:hidden;
}

/* Zahnrad */
.gear {
  width:40px;
  height:40px;
  border:4px solid var(--green-light);
  border-radius:50%;
  position:absolute;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  animation:rotate 3s linear infinite;
}

@keyframes rotate {
  from { transform:translateX(-50%) rotate(0deg); }
  to { transform:translateX(-50%) rotate(360deg); }
}

/* Sprechblase */
.bubble {
  position:absolute;
  top:-40px;
  right:-20px;
  background:#222;
  padding:10px 18px;
  border-radius:12px;
  border:2px solid var(--green-light);
  color:var(--green-light);
  font-weight:600;
  box-shadow:0 0 15px var(--green-glow);
}

.bubble::after {
  content:"";
  position:absolute;
  bottom:-10px;
  right:20px;
  width:0;
  height:0;
  border-left:10px solid transparent;
  border-right:10px solid transparent;
  border-top:10px solid #222;
}

/* TEXT */
h1 {
  font-size:2.4rem;
  background:linear-gradient(135deg,var(--green-light),var(--green-dark));
  -webkit-background-clip:text;
  color:transparent;
  text-shadow:0 0 20px var(--green-glow);
}

p {
  font-size:1.1rem;
  opacity:0.85;
  margin-top:10px;
}

a {
  color:var(--green-light);
  text-decoration:none;
  font-weight:600;
}
</style>
</head>

<body>

<div class="wrapper">

  <div class="animation">

    <!-- FIGURE -->
    <div class="figure">
      <div class="head">
        <div class="eye left"></div>
        <div class="eye right"></div>
      </div>
      <div class="body"></div>
    </div>

    <!-- COMPUTER -->
    <div class="computer">
      <div class="bubble">Error 404</div>
      <div class="screen">
        <div class="gear"></div>
      </div>
    </div>

  </div>

  <h1>Seite nicht gefunden</h1>
  <p>Der Ort, den du suchst, ist überwuchert, verlassen oder existiert nicht mehr.</p>
  <p><a href="index.html">Zurück zur Startseite</a></p>

</div>

</body>
</html>
